
# KubeDoctor monitoring configuration

grafana:
  enabled: true
  adminUser: admin
  adminPassword: CHANGE_ME_BEFORE_DEPLOYMENT
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 1d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
