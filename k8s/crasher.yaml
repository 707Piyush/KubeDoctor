
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crasher
  template:
    metadata:
      labels:
        app: crasher
    spec:
      containers:
        - name: crasher
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              print("Crasher application started")
              time.sleep(5)
              print("Simulating application crash")
              raise Exception("Intentional crash for KubeDoctor testing")
