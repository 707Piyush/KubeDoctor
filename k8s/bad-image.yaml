
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-image
  template:
    metadata:
      labels:
        app: bad-image
    spec:
      containers:
        - name: bad-image
          image: kubedoctor-demo/nonexistent-image:1.0
          imagePullPolicy: Always
